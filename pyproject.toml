[project]
name = "tagurit"
version = "0.1.0"
description = "Tag and cache what matters on a disconnected edge device, then sync to a cloudlet when the link returns."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "gabriel-client==5.2.0",
    "gabriel-protocol==5.1",
    "gabriel-server==5.2.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.32.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
